services:
  - type: web
    name: email-scheduler-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: REDIS_URL
        value: redis://default:gQAAAAAAAbnVAAIgcDEyYjVmYmZhZDc3MTc0OGY1OTU3YmZiYTkzMzcxY2UzNA@concrete-bee-113109.upstash.io:6379
      - key: JWT_SECRET
        value: super-secret-jwt-key-reachinbox-scheduler-2025
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"
      - key: GLOBAL_MAX_EMAILS_PER_HOUR
        value: "500"
